<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Neon Coast Studio</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="topbar"><div class="brand"><b>NC</b><span>NEON COAST STUDIO</span></div><div class="motto">ORDINARY PHOTOS. EXTRAORDINARY STORIES.</div><div class="version">LOCAL &amp; PRIVATE <i>V.03</i></div></header>
<main class="workspace"><aside class="rail">
  <section class="step"><h2><em>01</em> YOUR SCENES</h2><label class="drop"><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><strong>Drop photos here</strong><span>JPG, PNG or WebP · stays local</span></label><div class="sample-row"><button data-sample="boulevard">Boulevard</button><button data-sample="pier">Pier</button><button data-sample="street">Street</button><button data-sample="marina">Marina</button></div><div id="loaded" class="loaded"></div></section>
  <section class="step"><h2><em>02</em> SET THE SCENE</h2><div class="choice-grid" id="layouts"><button data-layout="collage">Collage</button><button data-layout="stack">Stack</button><button data-layout="hero">Hero</button><button data-layout="duo">Duo</button><button data-layout="tilt">Tilt</button></div><label class="field-label">COLOR STORY</label><div class="grade-grid" id="grades"><button data-grade="sunset"><i></i>Sunset</button><button data-grade="neon"><i></i>Neon</button><button data-grade="golden"><i></i>Golden</button><button data-grade="vivid"><i></i>Vivid</button></div></section>
  <section class="step"><h2><em>03</em> WRITE YOUR STORY</h2><div class="story-fields"><label class="field-label">COVER TITLE<input id="caption" maxlength="40" value="NEON COAST"></label><label class="field-label">SCRIPT SUBTITLE<input id="sub" maxlength="32" value="vice heat rising"></label><label class="field-label wide">STICKER<input id="sticker" maxlength="24" value="MAXIMUM HEAT"></label></div><div class="toggles"><label><input id="ink" type="checkbox"> Ink effect</label><label><input id="stars" type="checkbox" checked> Stars</label><label><input id="grain" type="checkbox" checked> Grain</label></div></section>
  <section class="step"><h2><em>04</em> FINE-TUNE</h2><div class="fine-grid"><label class="field-label">PHOTO ZOOM <output id="zoom-value">100%</output><input id="zoom" type="range" min="80" max="130" value="100"></label><label class="field-label">CANVAS FORMAT<select id="format"><option value="1920x1080">Landscape · 1920×1080</option><option value="1080x1350">Portrait · 1080×1350</option><option value="1080x1080" selected>Square · 1080×1080</option></select></label></div><button id="export" class="export"><span>↧</span> Export cover <small>PNG</small></button></section>
</aside><section class="preview"><div class="preview-head"><span id="size-readout">1080 × 1080 · PRINT-READY PNG</span><span>All changes live. All yours.</span></div><div class="canvas-wrap"><canvas id="cover" width="1080" height="1080"></canvas></div></section></main>
<script type="module" src="./src/main.js"></script></body></html>
